name: Build BENZO Manga Empire

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build APK File
        run: |
          flutter config --no-analytics
          flutter create --org com.benzo.manga manga_app
          if [ -f "lib/main.dart" ]; then
            cp -f lib/main.dart manga_app/lib/main.dart
          elif [ -f "main.dart" ]; then
            cp -f main.dart manga_app/lib/main.dart
          fi
          cd manga_app
          flutter build apk --debug

      - name: Upload BENZO APK
        uses: actions/upload-artifact@v4
        with:
          name: BENZO-Empire-APK
          path: manga_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
