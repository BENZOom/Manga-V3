name: Build Manga Al-Arab Masterpiece

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Compile Ultimate App
        run: |
          flutter create --org com.manga.alarab manga_app
          cd manga_app
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(const MangaAlArabEmpire());

          enum Role { owner, headAdmin, superAdmin, adminMonth, admin, translator, editor, member, guest }

          class VipPackage {
            final String id;
            final String name;
            final String perks;
            final int pointsPrice;
            final Color color;
            final bool hasDoublePoints;
            final bool hasOffline;
            final bool hasExclusiveSources;

            VipPackage({
              required this.id,
              required this.name,
              required this.perks,
              required this.pointsPrice,
              required this.color,
              this.hasDoublePoints = false,
              this.hasOffline = false,
              this.hasExclusiveSources = false,
            });
          }

          class MangaAlArabEmpire extends StatefulWidget {
            const MangaAlArabEmpire({Key? key}) : super(key: key);
            @override
            State<MangaAlArabEmpire> createState() => _MangaAlArabEmpireState();
          }

          class _MangaAlArabEmpireState extends State<MangaAlArabEmpire> {
            Role currentRole = Role.guest;
            String currentUser = "ضيف BENZO";
            bool isLoggedIn = false;
            String appName = "BENZO";
            String logoUrl = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400";
            int userPoints = 1000;
            bool antiHackShield = true;
            bool doublePoints = false;
            bool triplePoints = false;
            bool browserUnlocked = false;
            bool exclusiveSourcesUnlocked = false;
            bool offlineDownloadUnlocked = false;
            String discordUrl = "https://discord.gg/manga-alarab";
            Color currentThemeColor = const Color(0xFFFFB703);
            String? currentActiveBroadcast;

            final List<VipPackage> packages = [
              VipPackage(
                id: "1",
                name: "باقة المحارب الفضي ⚔️",
                perks: "إزالة الإعلانات بالكامل + شارة فضية مميزة + قراءة غير محدودة.",
                pointsPrice: 5000,
                color: Colors.blueGrey.shade300,
              ),
              VipPackage(
                id: "2",
                name: "باقة التنين الذهبي 🐉",
                perks: "فتح مصادر سوات ومانجاليك + هالة ذهبية للبروفايل + خصم 20% بالنقاط.",
                pointsPrice: 12000,
                color: const Color(0xFFFFB703),
                hasExclusiveSources: true,
              ),
              VipPackage(
                id: "3",
                name: "باقة إمبراطور المانجا 👑",
                perks: "دبل نقاط دائم (1000 نقطة لكل 5 فصول) + خط ملون متوهج + فصول تيم إكس.",
                pointsPrice: 25000,
                color: Colors.purpleAccent,
                hasDoublePoints: true,
                hasExclusiveSources: true,
              ),
              VipPackage(
                id: "4",
                name: "باقة حاكم الظلال الأبدي ⚡",
                perks: "تحميل الفصول وقراءتها بدون إنترنت + طلب ترجمة أعمال حصرية + شارة نارية.",
                pointsPrice: 50000,
                color: Colors.cyanAccent,
                hasDoublePoints: true,
                hasOffline: true,
                hasExclusiveSources: true,
              ),
              VipPackage(
                id: "5",
                name: "باقة العرش الإلهي (VIP المطلق) 🪐",
                perks: "تربل نقاط (1500 نقطة / 3 فصول) + ثيم ملكي + متصفح أدوات المانجا + شات كبار الشخصيات.",
                pointsPrice: 100000,
                color: Colors.redAccent,
                hasDoublePoints: true,
                hasOffline: true,
                hasExclusiveSources: true,
              ),
            ];

            final List<String> auditLogs = [
              "[أمان] تشغيل درع الحماية ومكافحة التخريب اللحظي لإمبراطورية BENZO.",
              "[سيرفر] دمج مصادر سوات مانجا وتيم إكس ومانجاليك.",
            ];

            void addLog(String log) {
              setState(() {
                auditLogs.insert(0, "[${DateTime.now().hour}:${DateTime.now().minute}] $log");
              });
            }

            void loginAs(String username, Role role) {
              setState(() {
                currentUser = username;
                currentRole = role;
                isLoggedIn = true;
                if (role == Role.owner) {
                  userPoints = 999999;
                  doublePoints = true;
                  triplePoints = true;
                  browserUnlocked = true;
                  exclusiveSourcesUnlocked = true;
                  offlineDownloadUnlocked = true;
                  currentThemeColor = const Color(0xFFFFB703);
                }
              });
              addLog("دخول ناجح للمستخدم: $username برتبة: $role");
            }

            void logout() {
              setState(() {
                currentRole = Role.guest;
                currentUser = "ضيف BENZO";
                isLoggedIn = false;
                browserUnlocked = false;
                doublePoints = false;
                triplePoints = false;
                exclusiveSourcesUnlocked = false;
                offlineDownloadUnlocked = false;
              });
              addLog("تم تسجيل الخروج");
            }

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: appName,
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF07070C),
                  cardColor: const Color(0xFF12121E),
                  primaryColor: currentThemeColor,
                ),
                home: Directionality(
                  textDirection: TextDirection.rtl,
                  child: MainHomeScreen(
                    appName: appName,
                    logoUrl: logoUrl,
                    currentUser: currentUser,
                    currentRole: currentRole,
                    isLoggedIn: isLoggedIn,
                    userPoints: userPoints,
                    doublePoints: doublePoints,
                    triplePoints: triplePoints,
                    browserUnlocked: browserUnlocked,
                    exclusiveSourcesUnlocked: exclusiveSourcesUnlocked,
                    offlineDownloadUnlocked: offlineDownloadUnlocked,
                    discordUrl: discordUrl,
                    packages: packages,
                    auditLogs: auditLogs,
                    currentBroadcast: currentActiveBroadcast,
                    onLogin: loginAs,
                    onLogout: logout,
                    onPointsChanged: (p) => setState(() => userPoints += p),
                    onNameChanged: (n) { setState(() => appName = n); addLog("تم تغيير اسم التطبيق إلى: $n"); },
                    onLogoChanged: (l) { setState(() => logoUrl = l); addLog("تم تحديث شعار التطبيق"); },
                    onDiscordChanged: (d) { setState(() => discordUrl = d); addLog("تم تحديث رابط ديسكورد"); },
                    onToggleBrowser: (v) { setState(() => browserUnlocked = v); addLog("تم ${v ? 'تفعيل' : 'تعطيل'} المتصفح"); },
                    onToggleDoublePoints: (v) { setState(() => doublePoints = v); addLog("تم تعديل دبل النقاط"); },
                    onToggleSources: (v) { setState(() => exclusiveSourcesUnlocked = v); addLog("تم تعديل المصادر"); },
                    onAddPackage: (pkg) {
                      setState(() => packages.add(pkg));
                      addLog("قام المالك BENZO بإنشاء باقة جديدة: ${pkg.name}");
                    },
                    onBroadcastSent: (msg) {
                      setState(() => currentActiveBroadcast = msg);
                      addLog("تم إرسال إشعار فوري لجميع المستخدمين: $msg");
                    },
                  ),
                ),
              );
            }
          }

          class MainHomeScreen extends StatefulWidget {
            final String appName;
            final String logoUrl;
            final String currentUser;
            final Role currentRole;
            final bool isLoggedIn;
            final int userPoints;
            final bool doublePoints;
            final bool triplePoints;
            final bool browserUnlocked;
            final bool exclusiveSourcesUnlocked;
            final bool offlineDownloadUnlocked;
            final String discordUrl;
            final List<VipPackage> packages;
            final List<String> auditLogs;
            final String? currentBroadcast;
            final Function(String, Role) onLogin;
            final VoidCallback onLogout;
            final Function(int) onPointsChanged;
            final Function(String) onNameChanged;
            final Function(String) onLogoChanged;
            final Function(String) onDiscordChanged;
            final Function(bool) onToggleBrowser;
            final Function(bool) onToggleDoublePoints;
            final Function(bool) onToggleSources;
            final Function(VipPackage) onAddPackage;
            final Function(String) onBroadcastSent;

            const MainHomeScreen({
              Key? key,
              required this.appName,
              required this.logoUrl,
              required this.currentUser,
              required this.currentRole,
              required this.isLoggedIn,
              required this.userPoints,
              required this.doublePoints,
              required this.triplePoints,
              required this.browserUnlocked,
              required this.exclusiveSourcesUnlocked,
              required this.offlineDownloadUnlocked,
              required this.discordUrl,
              required this.packages,
              required this.auditLogs,
              this.currentBroadcast,
              required this.onLogin,
              required this.onLogout,
              required this.onPointsChanged,
              required this.onNameChanged,
              required this.onLogoChanged,
              required this.onDiscordChanged,
              required this.onToggleBrowser,
              required this.onToggleDoublePoints,
              required this.onToggleSources,
              required this.onAddPackage,
              required this.onBroadcastSent,
            }) : super(key: key);

            @override
            State<MainHomeScreen> createState() => _MainHomeScreenState();
          }

          class _MainHomeScreenState extends State<MainHomeScreen> {
            int _tab = 0;
            final List<String> _comments = [
              "👑 BENZO (الفاوندر): مرحبًا بكم في إمبراطورية BENZO الرسمية!",
              "✍️ محرر سوات: فصول سولو ليفلينج راجناروك متوفرة الآن بدقة 4K.",
              "⚡ حاكم الظلال: تم تفعيل التحميل بدون نت من تطبيق BENZO بنجاح!",
            ];

            String getRoleTag(Role r) {
              switch (r) {
                case Role.owner: return "👑 BENZO (الفاوندر والمالك)";
                case Role.headAdmin: return "⚡ هيد ادمن";
                case Role.superAdmin: return "🛡️ سوبر ادمن";
                case Role.adminMonth: return "⭐ ادمن الشهر";
                case Role.admin: return "🔰 ادمن";
                case Role.translator: return "✍️ مترجم";
                case Role.editor: return "🎨 محرر";
                case Role.member: return "👤 عضو";
                case Role.guest: return "👀 ضيف (قراءة مقفلة)";
              }
            }

            bool get canUseBrowser => widget.currentRole == Role.owner || widget.browserUnlocked;

            @override
            Widget build(BuildContext context) {
              List<Widget> views = [
                _buildHome(),
                if (canUseBrowser) _buildBrowser(),
                _buildPackagesTab(),
                _buildSupportersTab(),
                _buildProfileTab(),
                if (widget.currentRole == Role.owner) _buil
